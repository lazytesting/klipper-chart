[extruder]
step_pin: PB3
dir_pin: REPLACE_EXTRUDER_DIR_PIN
enable_pin: !PC3
microsteps: 16
# Upstream Ender-3 S1 Sprite reference uses 26.359 and 42:12. Confirm your unit.
rotation_distance: REPLACE_EXTRUDER_ROTATION_DISTANCE
gear_ratio: REPLACE_EXTRUDER_GEAR_RATIO
nozzle_diameter: REPLACE_NOZZLE_DIAMETER
filament_diameter: 1.750
heater_pin: PA1
sensor_type: REPLACE_HOTEND_SENSOR
sensor_pin: PC5
min_temp: 0
max_temp: REPLACE_HOTEND_MAX_TEMP

[heater_bed]
heater_pin: PA2
sensor_type: REPLACE_BED_SENSOR
sensor_pin: PC4
min_temp: 0
max_temp: REPLACE_BED_MAX_TEMP

[fan]
pin: PA0
