# Creality V4.2.7 pins. Confirm directions and travel on the modified printer.
[mcu]
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 1000
max_z_velocity: 5
max_z_accel: 50

[stepper_x]
step_pin: PB9
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: REPLACE_X_MAX
homing_speed: 25

[stepper_y]
step_pin: PB7
dir_pin: PB8
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: REPLACE_Y_MAX
homing_speed: 25

[stepper_z]
step_pin: PB5
dir_pin: REPLACE_Z_DIR_PIN
enable_pin: !PC3
microsteps: 16
# Use effective mm of vertical travel per motor turn, including the pulley ratio.
rotation_distance: REPLACE_Z_ROTATION_DISTANCE
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: REPLACE_Z_MAX
homing_speed: 3
second_homing_speed: 2
