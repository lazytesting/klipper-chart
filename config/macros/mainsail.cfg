[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[pause_resume]

[gcode_macro CANCEL_PRINT]
description: Cancel the active print and turn off heaters and part cooling
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    M107
    BED_MESH_CLEAR
    CANCEL_PRINT_BASE
