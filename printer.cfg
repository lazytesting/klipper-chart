[include macros.cfg]

# Creality V4.2.7 pins. Confirm directions and travel on the modified printer.
[mcu]
serial: REPLACE_MCU_SERIAL
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 1000
max_z_velocity: 5
max_z_accel: 50

[stepper_x]
step_pin: PB9
dir_pin: PC2
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5
position_endstop: 0
position_max: REPLACE_X_MAX
homing_speed: 25

[stepper_y]
step_pin: PB7
dir_pin: PB8
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 0
position_max: REPLACE_Y_MAX
homing_speed: 25

[stepper_z]
step_pin: PB5
dir_pin: REPLACE_Z_DIR_PIN
enable_pin: !PC3
microsteps: 16
# Use effective mm of vertical travel per motor turn, including the pulley ratio.
rotation_distance: REPLACE_Z_ROTATION_DISTANCE
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: REPLACE_Z_MAX
homing_speed: 3
second_homing_speed: 2

[extruder]
step_pin: PB3
dir_pin: REPLACE_EXTRUDER_DIR_PIN
enable_pin: !PC3
microsteps: 16
# Upstream Ender-3 S1 Sprite reference uses 26.359 and 42:12. Confirm your unit.
rotation_distance: REPLACE_EXTRUDER_ROTATION_DISTANCE
gear_ratio: REPLACE_EXTRUDER_GEAR_RATIO
nozzle_diameter: REPLACE_NOZZLE_DIAMETER
filament_diameter: 1.750
heater_pin: PA1
sensor_type: REPLACE_HOTEND_SENSOR
sensor_pin: PC5
min_temp: 0
max_temp: REPLACE_HOTEND_MAX_TEMP
control: pid
pid_Kp: REPLACE_HOTEND_PID_KP
pid_Ki: REPLACE_HOTEND_PID_KI
pid_Kd: REPLACE_HOTEND_PID_KD

[heater_bed]
heater_pin: PA2
sensor_type: REPLACE_BED_SENSOR
sensor_pin: PC4
min_temp: 0
max_temp: REPLACE_BED_MAX_TEMP
control: pid
pid_Kp: REPLACE_BED_PID_KP
pid_Ki: REPLACE_BED_PID_KI
pid_Kd: REPLACE_BED_PID_KD

[fan]
pin: PA0

[bltouch]
# PB0 / PB1 apply when both signals use the V4.2.7 dedicated probe connector.
sensor_pin: REPLACE_BLTOUCH_SENSOR_PIN
control_pin: REPLACE_BLTOUCH_CONTROL_PIN
x_offset: REPLACE_PROBE_X_OFFSET
y_offset: REPLACE_PROBE_Y_OFFSET
z_offset: REPLACE_PROBE_Z_OFFSET

[safe_z_home]
# Nozzle XY position that places the probe over the bed for Z homing.
home_xy_position: REPLACE_SAFE_HOME_XY
speed: 40
z_hop: 10
z_hop_speed: 4

[bed_mesh]
# Mesh bounds are probe XY coordinates.
mesh_min: REPLACE_MESH_MIN
mesh_max: REPLACE_MESH_MAX
probe_count: 5, 5
speed: 60
horizontal_move_z: 5
adaptive_margin: 5
