[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[pause_resume]

[gcode_macro CANCEL_PRINT]
description: Cancel the active print and turn off heaters and part cooling
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    M107
    BED_MESH_CLEAR
    CANCEL_PRINT_BASE

[exclude_object]

[gcode_macro ADAPTIVE_MESH]
description: Probe the current print area using slicer object boundaries
gcode:
    {% set objects = printer.exclude_object.objects %}
    {% if not objects or objects | rejectattr("polygon") | list %}
        {action_raise_error("Adaptive mesh needs object polygons before ADAPTIVE_MESH. Check slicer object labels and Moonraker object processing.")}
    {% endif %}
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1
